services:
  - type: web
    name: pollit
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: node server/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pollit-db
          property: connectionString
      # On a unified deploy, CLIENT_ORIGIN equals the service URL.
      # Set this manually after the first deploy to your Render URL.
      - key: CLIENT_ORIGIN
        sync: false

databases:
  - name: pollit-db
    plan: free
    databaseName: polling
    user: polling
    region: oregon
