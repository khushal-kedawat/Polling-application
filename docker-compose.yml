services:
  postgres:
    image: postgres:16-alpine
    container_name: polling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polling
    ports:
      - "5433:5432"
    volumes:
      - polling-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polling"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  polling-pg-data:
